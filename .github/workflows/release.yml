name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm >= 11.5.1, required for trusted publishing
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never cache in release builds
      - run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify package layout
        run: npx publint
      # No NODE_AUTH_TOKEN: the npm CLI exchanges the GitHub OIDC token for a
      # short-lived publish credential. Provenance is generated automatically.
      - name: Publish
        run: npm publish --access public
