name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Codegen drift
        run: |
          npm run codegen
          git diff --exit-code -- src/generated
      - name: Build
        run: npm run build
      - name: Verify package layout
        run: npx publint

  test:
    runs-on: ubuntu-latest
    env:
      # Tests must not depend on the ambient key; keep this set to catch regressions.
      TESSERA_API_KEY: ci-dummy-key
    strategy:
      fail-fast: false
      matrix:
        node: ["18.20", "20", "22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test
